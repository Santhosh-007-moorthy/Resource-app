server.port=8080

# ---- MySQL DB connection ----
# Replace HOST, PORT, DATABASE_NAME with your MySQL instance details.
# Default local MySQL install usually runs on localhost:3306.
spring.datasource.url=jdbc:mysql://localhost:3306/resource_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sandi007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: creates the resources table automatically if missing,
# and keeps it in sync with the entity without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Admin account (seeded once automatically on first run - see DataSeeder) ----
# Change these before real use. Only this account can create/edit/delete Task Master
# entries; there is no public registration page anymore.
app.admin.username=admin
app.admin.password=Admin@123

# ---- Resource-person login accounts (auto-created when an admin adds a Resource) ----
# Every resource person's username is their Name ID (as entered on the Resource page) and
# they all share this one password. Change it before real use - see ResourceController.
app.resource.user.password=Resource@123

# ---- Per-resource-person databases ----
# Base MySQL server URL with NO database name on the end. Used to CREATE DATABASE
# and connect to each resource person's own database (see PersonDatabaseService).
app.mysql.server-url=jdbc:mysql://localhost:3306
